<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Album</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:Arial, sans-serif;
    background:#07192c;
    color:white;
}

/* =========================
   🌌 FONDO
========================= */

canvas{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100%;
    z-index:0;
    pointer-events:none;
}

/* =========================
   CAPAS
========================= */

.main,
.album-content,
.player{
    position:relative;
    z-index:2;
}

/* =========================
   🌙 PORTADA
========================= */

.main{
    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:70px;

    padding:40px;

    transition:1s;
}

.left{
    width:320px;

    display:flex;
    flex-direction:column;
    align-items:flex-start;

    flex-shrink:0;
}

.left h1{
    font-size:28px;
    font-weight:normal;

    line-height:1.2;

    margin-bottom:35px;
}

.album-cover{
    width:380px;
    height:380px;

    object-fit:cover;

    box-shadow:
    0 0 35px rgba(0,0,0,0.45);

    flex-shrink:0;

    transition:1s;
}

.opening{
    transform:scale(0.7);
    opacity:0;
    pointer-events:none;
}

/* =========================
   🔘 BOTONES
========================= */

button{

    position:relative;

    padding:16px 34px;

    border:none;

    border-radius:999px;

    background:
    linear-gradient(
        135deg,
        rgba(85,120,255,0.95),
        rgba(30,50,120,0.95)
    );

    color:white;

    font-size:18px;

    font-weight:700;

    letter-spacing:1px;

    cursor:pointer;

    overflow:hidden;

    transition:0.35s;

    box-shadow:
    0 0 20px rgba(70,120,255,0.35),
    inset 0 0 15px rgba(255,255,255,0.08);

    backdrop-filter:blur(10px);
}

button::before{

    content:"";

    position:absolute;

    top:0;
    left:-120%;

    width:80%;
    height:100%;

    background:
    linear-gradient(
        90deg,
        transparent,
        rgba(255,255,255,0.45),
        transparent
    );

    transform:skewX(-25deg);

    transition:0.7s;
}

button:hover::before{
    left:140%;
}

button:hover{

    transform:
    translateY(-4px)
    scale(1.05);

    box-shadow:
    0 0 30px rgba(120,170,255,0.5),
    inset 0 0 18px rgba(255,255,255,0.15);
}

/* =========================
   📖 CONTENIDO
========================= */

.album-content{

    position:absolute;
    inset:0;

    display:flex;
    justify-content:center;
    align-items:center;

    gap:18px;

    opacity:0;
    pointer-events:none;

    transition:1s;

    padding:30px;
}

.album-content.show{
    opacity:1;
    pointer-events:auto;
}

/* =========================
   🖼️ PÁGINAS
========================= */

.page{

    width:340px;
    height:470px;

    display:flex;
    justify-content:center;
    align-items:center;

    overflow:hidden;

    flex-shrink:0;

    transition:0.5s;
}

.page img{

    width:100%;
    height:100%;

    object-fit:contain;

    display:block;

    filter:
    drop-shadow(0 0 20px rgba(0,0,0,0.4));

    transition:0.5s;
}

/* 💌 CARTA */

.letter-page{

    width:390px !important;
    height:550px !important;

    transform:
    translateY(-60px);
}

.letter-img{
    object-fit:contain !important;
}

/* 🎞️ ANIMACIÓN */

.page.turn{

    transform:
    scale(0.92)
    rotateY(10deg);

    opacity:0.2;
}

/* =========================
   ⬅️➡️
========================= */

.nav-btn{

    position:absolute;

    top:50%;

    transform:translateY(-50%);

    z-index:20;
}

.prev{
    left:50px;
}

.next{
    right:50px;
}

/* =========================
   🎵 PLAYER
========================= */

.player{

    position:fixed;

    left:0;
    bottom:0;

    width:100%;
    height:75px;

    background:
    rgba(0,0,0,0.92);

    border-top:
    1px solid rgba(255,255,255,0.1);

    display:none;

    flex-direction:column;

    justify-content:center;

    padding:10px 15px;

    backdrop-filter:blur(12px);

    z-index:999;
}

.song-name{

    font-size:13px;

    margin-bottom:8px;

    letter-spacing:1px;
}

.controls{

    display:flex;
    align-items:center;
    gap:12px;
}

.play-btn{

    width:32px;
    height:32px;

    border-radius:50%;

    border:none;

    background:white;
    color:black;

    font-size:13px;

    cursor:pointer;

    display:flex;
    justify-content:center;
    align-items:center;

    padding:0;
}

/* =========================
   🎚️ BARRA
========================= */

.progress{

    flex:1;

    appearance:none;

    height:6px;

    border-radius:20px;

    background:
    linear-gradient(
        to right,
        #ffffff 0%,
        #ffffff var(--progress,0%),
        rgba(255,255,255,0.18) var(--progress,0%),
        rgba(255,255,255,0.18) 100%
    );

    cursor:pointer;
}

.progress::-webkit-slider-thumb{

    appearance:none;

    width:15px;
    height:15px;

    border-radius:50%;

    background:white;

    border:none;

    box-shadow:
    0 0 10px rgba(255,255,255,0.7);
}

/* =========================
   📱 RESPONSIVE
========================= */

@media (max-width:950px){

    .main{
        flex-direction:column;
        gap:40px;
    }

    .left{
        align-items:center;
        text-align:center;
    }

    .album-cover{
        width:320px;
        height:320px;
    }

    .page{
        width:260px;
        height:380px;
    }

    .letter-page{
        width:320px !important;
        height:470px !important;

        transform:
        translateY(-45px);
    }

    .nav-btn{
        top:auto;
        bottom:95px;
        transform:none;
    }

    .prev{
        left:20%;
    }

    .next{
        right:20%;
    }
}

@media (max-width:700px){

    .main{
        flex-direction:column;
        gap:30px;
        padding:20px;
    }

    .left h1{
        font-size:22px;
    }

    .album-cover{
        width:270px;
        height:270px;
    }

    .album-content{
        gap:8px;
        padding:12px;
    }

    .page{
        width:44vw;
        height:58vh;
    }

    .letter-page{
        width:78vw !important;
        height:68vh !important;

        transform:
        translateY(-35px);
    }

    .prev{
        left:10px;
    }

    .next{
        right:10px;
    }

    button{
        padding:14px 24px;
        font-size:15px;
    }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<!-- 🌙 PORTADA -->

<div class="main" id="mainScreen">

    <div class="left">

        <h1>
            Te hice un álbum<br>
            Espero te guste
        </h1>

        <button id="startBtn">
            EMPEZAR
        </button>

    </div>

    <img
        src="demp2.png"
        class="album-cover"
    >

</div>

<!-- 📖 CONTENIDO -->

<div class="album-content" id="albumContent">

    <button class="nav-btn prev" id="prevBtn">
        Atrás
    </button>

    <div class="page" id="leftContainer">
        <img id="leftPage" src="can1.png">
    </div>

    <div class="page" id="rightContainer">
        <img id="rightPage" src="let1.png">
    </div>

    <button class="nav-btn next" id="nextBtn">
        Siguiente
    </button>

</div>

<!-- 🎵 PLAYER -->

<div class="player">

    <div
        class="song-name"
        id="songName"
    >
        YOKO
    </div>

    <div class="controls">

        <button
            class="play-btn"
            id="playBtn"
        >
            ❚❚
        </button>

        <input
            type="range"
            min="0"
            max="100"
            value="0"
            class="progress"
            id="progress"
        >

    </div>

</div>

<audio id="audio"></audio>

<script>

/* =========================
   🎵 CANCIONES
========================= */

const songs = [

{
    name:"YOKO",
    audio:"aud1.m4a",
    left:"can1.png",
    right:"let1.png"
},

{
    name:"309",
    audio:"aud2.m4a",
    left:"can2.png",
    right:"let2.png"
},

{
    name:"M.A.I",
    audio:"aud3.m4a",
    left:"can3.png",
    right:"let3.png"
},

{
    name:"Til Kingdom Come",
    audio:"aud4.m4a",
    left:"can4.png",
    right:"let4.png"
},

{
    name:"Perdon",
    audio:"aud5.m4a",
    left:"can5.png",
    right:"let5.png"
},

{
    name:"IMU",
    audio:"aud6.m4a",
    left:"can6.png",
    right:"let6.png"
},

{
    name:"Labios De Cereza 3",
    audio:"aud7.m4a",
    left:"can7.png",
    right:"let7.png"
},

{
    name:"No Te Quiero Perder",
    audio:"aud8.m4a",
    left:"can8.png",
    right:"let8.png"
},

{
    name:"Si Pudiera",
    audio:"aud9.m4a",
    left:"can9.png",
    right:"let9.png"
},

{
    name:"La Gloria Eres Tu",
    audio:"aud10.m4a",
    left:"can10.png",
    right:"let10.png"
},

{
    name:"Propuesta",
    audio:"aud11.m4a",
    left:"can11.png",
    right:"let11.png"
},

{
    name:"Toda Esta Ciudad",
    audio:"aud12.m4a",
    left:"can12.png",
    right:"let12.png"
},

{
    name:"Everything in You",
    audio:"aud13.m4a",
    left:"can13.png",
    right:"let13.png"
},

{
    name:"Tu Eres Mi Cancion Favorita",
    left:"carta.png",
    right:"carta.png",
    letter:true
}

];

let currentSong = 0;

const audio =
document.getElementById("audio");

const leftPage =
document.getElementById("leftPage");

const rightPage =
document.getElementById("rightPage");

const leftContainer =
document.getElementById("leftContainer");

const rightContainer =
document.getElementById("rightContainer");

const songName =
document.getElementById("songName");

const progress =
document.getElementById("progress");

const playBtn =
document.getElementById("playBtn");

/* =========================
   🎵 CARGAR CANCIÓN
========================= */

function loadSong(index){

    const song = songs[index];

    leftContainer.classList.add("turn");
    rightContainer.classList.add("turn");

    setTimeout(()=>{

        if(song.letter){

            audio.pause();
            audio.src = "";

            rightContainer.style.display =
            "none";

            leftContainer.classList.add(
                "letter-page"
            );

            leftPage.classList.add(
                "letter-img"
            );

            leftPage.src = "carta.png";

            document
            .querySelector(".player")
            .style.display="none";

        }else{

            audio.src = song.audio;

            leftPage.src = song.left;
            rightPage.src = song.right;

            songName.textContent =
            song.name;

            rightContainer.style.display =
            "flex";

            leftContainer.classList.remove(
                "letter-page"
            );

            leftPage.classList.remove(
                "letter-img"
            );

            document
            .querySelector(".player")
            .style.display="flex";

            audio.loop = false;

            audio.play();

            playBtn.textContent =
            "❚❚";
        }

        leftContainer.classList.remove("turn");
        rightContainer.classList.remove("turn");

    },300);
}

/* ▶️ PLAY / PAUSA */

playBtn.addEventListener(
"click",()=>{

    if(audio.paused){

        audio.play();
        playBtn.textContent="❚❚";

    }else{

        audio.pause();
        playBtn.textContent="▶";
    }
});

/* 🎚️ BARRA */

audio.addEventListener(
"timeupdate",()=>{

    const progressPercent =

    (audio.currentTime
    / audio.duration) * 100;

    progress.value =
    progressPercent || 0;

    progress.style.setProperty(
        "--progress",
        progressPercent + "%"
    );
});

progress.addEventListener(
"input",()=>{

    const time =

    (progress.value / 100)
    * audio.duration;

    audio.currentTime = time;
});

/* ⏭️ AUTO SIGUIENTE */

audio.addEventListener(
"ended",()=>{

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
});

/* 🌙 INICIO */

const startBtn =
document.getElementById("startBtn");

const mainScreen =
document.getElementById("mainScreen");

const albumContent =
document.getElementById("albumContent");

startBtn.addEventListener(
"click",()=>{

    mainScreen.classList
    .add("opening");

    setTimeout(()=>{

        mainScreen.style.display="none";

        albumContent.classList
        .add("show");

        currentSong = 0;

        loadSong(currentSong);

    },1000);
});

/* ➡️ SIGUIENTE */

document.getElementById("nextBtn")
.addEventListener("click",()=>{

    if(songs[currentSong].letter){

        window.location.href =
        "https://open.spotify.com/playlist/5jFIZ9fjzOGbvmyoXgDJsE?si=69c66c19ecef4ba8&pt=2d4ef307f05369cbf443e6e1c3af131a";

        return;
    }

    currentSong++;

    if(currentSong >= songs.length){
        currentSong = 0;
    }

    loadSong(currentSong);
});

/* ⬅️ ATRÁS */

document.getElementById("prevBtn")
.addEventListener("click",()=>{

    if(currentSong <= 0){

        audio.pause();

        albumContent.classList
        .remove("show");

        document
        .querySelector(".player")
        .style.display="none";

        setTimeout(()=>{

            mainScreen.style.display="flex";

            setTimeout(()=>{

                mainScreen.classList
                .remove("opening");

            },50);

        },500);

        return;
    }

    currentSong--;

    loadSong(currentSong);
});

/* =========================
   🌌 FONDO ANIMADO
========================= */

const canvas =
document.getElementById("bg");

const ctx =
canvas.getContext("2d");

canvas.width =
window.innerWidth;

canvas.height =
window.innerHeight;

let stars =
Array.from({length:90},()=>({

    x:Math.random()*canvas.width,
    y:Math.random()*canvas.height*0.6,
    size:Math.random()*2
}));

let clouds =
Array.from({length:4},()=>({

    x:Math.random()*canvas.width,
    y:Math.random()*200,

    size:90+Math.random()*60,
    speed:0.15+Math.random()*0.2
}));

let shootingStars = [];

let lastSpawn = 0;
let spawnInterval = 4000;
let waveOffset = 0;

function createShootingStar(){

    shootingStars.push({

        x:Math.random()
        *canvas.width*0.5,

        y:Math.random()
        *canvas.height*0.3,

        vx:10,
        vy:4,

        length:200,

        life:0,
        maxLife:60
    });
}

function drawMoon(){

    let x =
    canvas.width*0.8;

    let y =
    canvas.height*0.2;

    let g =
    ctx.createRadialGradient(
        x,y,10,
        x,y,100
    );

    g.addColorStop(
        0,
        "rgba(255,255,255,0.9)"
    );

    g.addColorStop(
        1,
        "rgba(255,255,255,0)"
    );

    ctx.beginPath();

    ctx.arc(
        x,y,100,0,Math.PI*2
    );

    ctx.fillStyle=g;
    ctx.fill();

    ctx.beginPath();

    ctx.arc(
        x,y,40,0,Math.PI*2
    );

    ctx.fillStyle="white";
    ctx.fill();
}

function drawClouds(){

    clouds.forEach(c=>{

        ctx.fillStyle=
        "rgba(255,255,255,0.12)";

        ctx.beginPath();

        ctx.arc(c.x,c.y,c.size*0.6,0,Math.PI*2);

        ctx.arc(c.x+50,c.y+10,c.size*0.5,0,Math.PI*2);

        ctx.arc(c.x-50,c.y+10,c.size*0.5,0,Math.PI*2);

        ctx.fill();

        c.x += c.speed;

        if(c.x-c.size > canvas.width){

            c.x = -c.size;
        }
    });
}

function drawStars(){

    ctx.fillStyle="white";

    stars.forEach(s=>{

        ctx.fillRect(
            s.x,
            s.y,
            s.size,
            s.size
        );
    });
}

function drawShootingStars(){

    shootingStars.forEach((s,i)=>{

        let g =
        ctx.createLinearGradient(

            s.x,
            s.y,

            s.x-s.length,
            s.y-s.length*0.4
        );

        g.addColorStop(0,"white");
        g.addColorStop(1,"transparent");

        ctx.beginPath();

        ctx.moveTo(s.x,s.y);

        ctx.lineTo(
            s.x-s.length,
            s.y-s.length*0.4
        );

        ctx.strokeStyle=g;

        ctx.lineWidth=2;

        ctx.stroke();

        s.x += s.vx;
        s.y += s.vy;

        s.life++;

        if(s.life>s.maxLife){

            shootingStars.splice(i,1);
        }
    });
}

function drawMountains(){

    ctx.fillStyle="#061425";

    ctx.beginPath();

    ctx.moveTo(0,canvas.height*0.6);

    ctx.quadraticCurveTo(
        canvas.width*0.25,
        canvas.height*0.48,

        canvas.width*0.5,
        canvas.height*0.6
    );

    ctx.quadraticCurveTo(
        canvas.width*0.75,
        canvas.height*0.5,

        canvas.width,
        canvas.height*0.62
    );

    ctx.lineTo(canvas.width,canvas.height);

    ctx.lineTo(0,canvas.height);

    ctx.closePath();

    ctx.fill();
}

function drawWaves(){

    ctx.beginPath();

    for(let x=0;x<canvas.width;x++){

        let y =

        Math.sin(
            x*0.02
            + waveOffset
        )*10

        + canvas.height*0.74;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(
        canvas.width,
        canvas.height
    );

    ctx.lineTo(
        0,
        canvas.height
    );

    ctx.closePath();

    ctx.fillStyle="#2d89e5";

    ctx.fill();

    waveOffset += 0.03;
}

function drawSand(){

    ctx.fillStyle="#c5a86f";

    ctx.beginPath();

    ctx.moveTo(0,canvas.height*0.9);

    for(let x=0;x<=canvas.width;x+=10){

        let y =

        canvas.height*0.9
        + Math.sin(x*0.01)*4;

        ctx.lineTo(x,y);
    }

    ctx.lineTo(canvas.width,canvas.height);

    ctx.lineTo(0,canvas.height);

    ctx.closePath();

    ctx.fill();
}

function animate(time){

    ctx.clearRect(
        0,
        0,
        canvas.width,
        canvas.height
    );

    drawStars();
    drawMoon();
    drawClouds();
    drawShootingStars();
    drawMountains();
    drawWaves();
    drawSand();

    if(time-lastSpawn > spawnInterval){

        createShootingStar();

        lastSpawn = time;

        spawnInterval =
        3000 + Math.random()*4000;
    }

    requestAnimationFrame(animate);
}

animate(0);

window.addEventListener(
"resize",()=>{

    canvas.width =
    window.innerWidth;

    canvas.height =
    window.innerHeight;
});

</script>

</body>
</html>
